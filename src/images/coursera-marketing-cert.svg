<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="8" fill="#0056D2"/>

  <!-- Left column -->
  <rect x="0" y="0" width="520" height="500" fill="#ffffff"/>

  <!-- Right ribbon column -->
  <rect x="520" y="0" width="280" height="500" fill="#f5f5f5"/>

  <!-- University of London logo area -->
  <rect x="40" y="40" width="180" height="60" rx="4" fill="#8B0000" opacity="0.1"/>
  <text x="130" y="65" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8B0000" text-anchor="middle">UNIVERSITY</text>
  <text x="130" y="82" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8B0000" text-anchor="middle">OF LONDON</text>

  <!-- Date -->
  <text x="40" y="150" font-family="Georgia, serif" font-size="16" fill="#666666">May 19, 2026</text>

  <!-- Name -->
  <text x="40" y="210" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#1a1a1a">Etrit Hasolli</text>

  <!-- Has successfully completed -->
  <text x="40" y="255" font-family="Georgia, serif" font-size="16" fill="#444444">has successfully completed</text>

  <!-- Course title -->
  <text x="40" y="300" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1a1a1a">Fundamentals of</text>
  <text x="40" y="335" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1a1a1a">Marketing Strategy</text>

  <!-- Subtitle -->
  <text x="40" y="375" font-family="Georgia, serif" font-size="13" fill="#666666">an online course authorized by University of London</text>
  <text x="40" y="393" font-family="Georgia, serif" font-size="13" fill="#666666">and offered through Coursera</text>

  <!-- Divider line -->
  <line x1="40" y1="430" x2="480" y2="430" stroke="#cccccc" stroke-width="1"/>

  <!-- Instructor -->
  <text x="40" y="455" font-family="Georgia, serif" font-size="13" fill="#444444">Dr Dominic Appiah, School of Business and Management</text>

  <!-- Right side: Course Certificate badge area -->
  <text x="660" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="3" fill="#555555" text-anchor="middle">COURSE</text>
  <text x="660" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="3" fill="#555555" text-anchor="middle">CERTIFICATE</text>

  <!-- Coursera circle badge -->
  <circle cx="660" cy="280" r="100" fill="none" stroke="#cccccc" stroke-width="2"/>
  <circle cx="660" cy="280" r="90" fill="none" stroke="#cccccc" stroke-width="1"/>

  <!-- Coursera text in badge -->
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0056D2" text-anchor="middle">coursera</text>

  <!-- Badge label -->
  <text x="660" y="310" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">COURSE CERTIFICATE</text>

  <!-- Verify text -->
  <text x="660" y="430" font-family="Arial, sans-serif" font-size="11" fill="#0056D2" text-anchor="middle">coursera.org/verify/6MB7UAJ7KNTH</text>
</svg>
